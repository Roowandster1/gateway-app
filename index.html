<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gateway</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        var(--tg-theme-bg-color, #0E1116);
    --surface:   var(--tg-theme-secondary-bg-color, #161B22);
    --text:      var(--tg-theme-text-color, #E6EDF3);
    --hint:      var(--tg-theme-hint-color, #7D8590);
    --line:      color-mix(in srgb, var(--hint) 22%, transparent);
    --line-soft: color-mix(in srgb, var(--hint) 12%, transparent);

    --accent:      #6FC93C;   /* overridden by CONFIG.brand.accent */
    --accent-ink:  #07140B;
    --live:        #35C26B;

    --r-sm: 7px;
    --r-md: 11px;
    --col:  520px;

    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --grot: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--grot);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .shell { max-width: var(--col); margin: 0 auto; padding: 14px 18px 40px; }

  /* status strip */
  .ticker {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--hint);
    padding: 9px 11px; border: 1px solid var(--line-soft); border-radius: var(--r-sm);
    background: color-mix(in srgb, var(--surface) 60%, transparent);
    overflow: hidden; white-space: nowrap;
  }
  .ticker .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto;
    animation: beat 2.4s ease-out infinite;
  }
  .ticker .sep { color: var(--line); }
  .ticker .lead { color: var(--text); font-weight: 600; }
  .ticker .tail { margin-left: auto; color: var(--hint); }

  @keyframes beat {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* brand */
  .brand { display: flex; align-items: center; gap: 13px; margin: 24px 2px 6px; }
  .mark {
    width: 48px; height: 48px; flex: 0 0 auto; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 600; font-size: 16px; letter-spacing: 0.04em;
    color: var(--accent);
    border: 1px solid var(--line-soft);
    background: var(--surface);
    overflow: hidden;
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; }
  .brand h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.05; }
  .brand p { margin-top: 4px; font-size: 13px; color: var(--hint); line-height: 1.35; max-width: 34ch; }

  /* section header */
  .sec {
    display: flex; align-items: baseline; gap: 10px; margin: 26px 2px 2px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hint);
  }
  .sec .rule { flex: 1; height: 1px; background: var(--line); }
  .sec .n { color: var(--accent); }

  /* market-line rows */
  .board { margin-top: 4px; }
  .row {
    display: flex; align-items: center; gap: 13px; padding: 15px 4px;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none; color: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .14s ease, padding-left .14s ease;
    opacity: 0; transform: translateY(7px);
    animation: rise .42s cubic-bezier(.22,.61,.36,1) forwards;
    animation-delay: calc(var(--i, 0) * 55ms + 80ms);
  }
  .row:active { background: color-mix(in srgb, var(--text) 5%, transparent); }
  @media (hover: hover) {
    .row:hover { background: color-mix(in srgb, var(--text) 4%, transparent); padding-left: 8px; }
    .row:hover .go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .sym {
    width: 42px; height: 42px; flex: 0 0 auto; border-radius: 10px;
    display: grid; place-items: center; font-size: 19px;
    font-family: var(--mono); font-weight: 600; letter-spacing: 0.02em;
    background: var(--surface); border: 1px solid var(--line-soft); color: var(--text);
    position: relative;
  }
  .sym.live::after {
    content: ""; position: absolute; top: -2px; right: -2px;
    width: 9px; height: 9px; border-radius: 50%; background: var(--live);
    border: 2px solid var(--bg); animation: beat 2.4s ease-out infinite;
  }

  .main { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.2; }
  .desc { font-size: 12.5px; color: var(--hint); line-height: 1.3; margin-top: 2px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta {
    display: flex; align-items: center; gap: 8px; margin-top: 6px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--hint);
  }
  .tag { text-transform: uppercase; letter-spacing: 0.1em; color: color-mix(in srgb, var(--accent) 85%, var(--text)); }
  .figure { color: var(--text); font-variant-numeric: tabular-nums; }
  .figure::before { content: "·"; color: var(--line); margin-right: 8px; }

  .go {
    flex: 0 0 auto;
    font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    padding: 8px 13px; border-radius: 999px; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: transparent;
    transition: background .14s ease, color .14s ease, border-color .14s ease;
  }

  .foot {
    margin-top: 30px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em;
    color: var(--hint); line-height: 1.6; border-top: 1px solid var(--line-soft); padding-top: 16px;
  }
  .foot a { color: var(--accent); text-decoration: none; }

  .empty {
    margin-top: 40px; padding: 30px 20px; text-align: center;
    border: 1px dashed var(--line); border-radius: var(--r-md);
    color: var(--hint); font-size: 13px; line-height: 1.5;
  }
  .empty code { font-family: var(--mono); color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .row { animation: none; opacity: 1; transform: none; }
    .ticker .dot, .sym.live::after { animation: none; }
  }
</style>
</head>
<body>
  <main class="shell" id="app"></main>

<script>
/* ================================================================
   CONFIG  ←  the only part you edit.

   Per channel:
     name      (required)
     url       (required)  full https://t.me/...  or  https://t.me/+inviteHash
     type      "channel" | "group"
     desc      optional one-liner
     category  optional — if EVERY channel has one, the list splits into sections
     emoji     optional — falls back to the first letter of the name
     live      optional — true shows a pulsing dot on the tile
     members   optional — manual fallback string, used only if a live count can't be fetched
     chatId    optional — only needed for PRIVATE chats (invite links): the numeric id like -1001234567890
                public chats are looked up automatically from the url

   Live counts also need:  BOT_TOKEN set in Railway, and the bot added as admin to each chat.
   ================================================================ */
const CONFIG = {
  brand: {
    name: "THE MODEL",
    tagline: "Free tips. Real value. Bet smart.",
    initials: "TM",
    logoUrl: "logo.png",
    accent: "#6FC93C"
  },

  status: { label: "Markets open", showCount: true, showDate: true },

  channels: [
    { name: "The Model", url: "https://t.me/themodeltips", type: "group", desc: "Cards, announcements and member chat — talk bets with the group.", category: "Main", emoji: "⚽", live: true },
    { name: "Live Updates", url: "https://t.me/themodelliveupdates", type: "channel", desc: "Live in-play updates — know what's happening throughout the game.", category: "Updates", emoji: "📡", live: true },
    { name: "History", url: "https://t.me/themodelhistory", type: "channel", desc: "Past results and track record — see how the model has performed.", category: "Results", emoji: "📈" }

    // Add more below (each line starts with a comma). Example:
    // ,{ name: "The Model Bet Bot", url: "https://t.me/TheModelBetbot", type: "channel", desc: "Get the cards straight from the bot.", category: "Bots" }
  ],

  footer: "18+ · Tips are opinion, not financial advice."
};

/* ================================================================
   No need to edit below.
   ================================================================ */
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");

function applyTelegram() {
  if (!tg) return;
  try { tg.ready(); } catch (e) {}
  try { tg.expand(); } catch (e) {}
  const paint = () => {
    try { tg.setBackgroundColor && tg.setBackgroundColor("bg_color"); } catch (e) {}
    try { tg.setHeaderColor && tg.setHeaderColor("bg_color"); } catch (e) {}
  };
  paint();
  tg.onEvent && tg.onEvent("themeChanged", paint);
}

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function handleFromUrl(url) {
  const m = String(url).match(/t\.me\/([A-Za-z0-9_]{3,})$/); // public username only
  return m ? "@" + m[1] : null;
}

function formatCount(n) {
  if (n < 1000) return String(n);
  if (n < 1e6) { const k = n / 1000; return (k < 100 ? k.toFixed(1).replace(/\.0$/, "") : Math.round(k)) + "K"; }
  const m = n / 1e6; return (m < 100 ? m.toFixed(1).replace(/\.0$/, "") : Math.round(m)) + "M";
}

function open(url) {
  if (inTelegram && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
  if (inTelegram && tg.openTelegramLink && /(^https?:\/\/)?t\.me\//.test(url)) tg.openTelegramLink(url);
  else if (inTelegram && tg.openLink) tg.openLink(url);
  else window.open(url, "_blank", "noopener");
}

function rowEl(ch, i) {
  const a = el("a", "row");
  a.href = ch.url; a.target = "_blank"; a.rel = "noopener";
  a.style.setProperty("--i", i);
  a.addEventListener("click", function (e) { e.preventDefault(); open(ch.url); });

  const sym = el("div", "sym" + (ch.live ? " live" : ""));
  sym.textContent = ch.emoji || (ch.name || "?").trim().charAt(0).toUpperCase();
  a.appendChild(sym);

  const main = el("div", "main");
  main.appendChild(el("div", "name", escapeHtml(ch.name || "Untitled")));
  if (ch.desc) main.appendChild(el("div", "desc", escapeHtml(ch.desc)));

  const meta = el("div", "meta");
  meta.appendChild(el("span", "tag", ch.type === "group" ? "Group" : "Channel"));

  const chatId = ch.chatId || handleFromUrl(ch.url);
  if (ch.members || chatId) {
    const fig = el("span", "figure");
    if (ch.members) { fig.textContent = ch.members + " members"; fig.dataset.manual = "1"; }
    else { fig.textContent = "…"; }
    if (chatId) fig.dataset.chat = chatId;
    meta.appendChild(fig);
  }
  main.appendChild(meta);
  a.appendChild(main);

  a.appendChild(el("span", "go", ch.type === "group" ? "JOIN" : "OPEN"));
  return a;
}

async function updateCounts() {
  const els = Array.from(document.querySelectorAll(".figure[data-chat]"));
  if (!els.length) return;
  const chats = Array.from(new Set(els.map((e) => e.dataset.chat)));

  let data = {};
  try {
    const r = await fetch("/api/counts?chats=" + encodeURIComponent(chats.join(",")));
    data = await r.json();
  } catch (e) { data = {}; }

  els.forEach((e) => {
    const n = data[e.dataset.chat];
    if (typeof n === "number") e.textContent = formatCount(n) + " members";
    else if (e.dataset.manual !== "1") e.remove(); // no live data, no manual fallback
  });
}

function render() {
  const app = document.getElementById("app");
  const b = CONFIG.brand || {};
  document.documentElement.style.setProperty("--accent", b.accent || "#F5B53D");

  const chans = Array.isArray(CONFIG.channels) ? CONFIG.channels : [];

  const st = CONFIG.status || {};
  const ticker = el("div", "ticker");
  ticker.appendChild(el("span", "dot"));
  ticker.appendChild(el("span", "lead", escapeHtml((st.label || "Live").toUpperCase())));
  if (st.showCount !== false && chans.length) {
    ticker.appendChild(el("span", "sep", "·"));
    ticker.appendChild(el("span", null, chans.length + (chans.length === 1 ? " channel" : " channels")));
  }
  if (st.showDate !== false) {
    const d = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short" }).toUpperCase();
    ticker.appendChild(el("span", "tail", d));
  }
  app.appendChild(ticker);

  const brand = el("div", "brand");
  const mark = el("div", "mark");
  const fallbackInitials = (b.initials || (b.name || "•").trim().charAt(0)).toUpperCase();
  if (b.logoUrl) {
    const img = el("img"); img.src = b.logoUrl; img.alt = "";
    img.onerror = function () { mark.innerHTML = ""; mark.textContent = fallbackInitials; };
    mark.appendChild(img);
  } else {
    mark.textContent = fallbackInitials;
  }
  brand.appendChild(mark);
  const btxt = el("div");
  btxt.appendChild(el("h1", null, escapeHtml(b.name || "Gateway")));
  if (b.tagline) btxt.appendChild(el("p", null, escapeHtml(b.tagline)));
  brand.appendChild(btxt);
  app.appendChild(brand);

  if (!chans.length) {
    app.appendChild(el("div", "empty", 'No channels yet. Add them to <code>CONFIG.channels</code> at the top of this file.'));
    return;
  }

  const allCategorised = chans.every(function (c) { return c.category; });
  let idx = 0;

  if (allCategorised) {
    const order = []; const groups = {};
    chans.forEach(function (c) {
      if (!groups[c.category]) { groups[c.category] = []; order.push(c.category); }
      groups[c.category].push(c);
    });
    order.forEach(function (cat) {
      const sec = el("div", "sec");
      sec.appendChild(el("span", "label", escapeHtml(cat.toUpperCase())));
      sec.appendChild(el("span", "rule"));
      sec.appendChild(el("span", "n", String(groups[cat].length).padStart(2, "0")));
      app.appendChild(sec);
      const board = el("div", "board");
      groups[cat].forEach(function (c) { board.appendChild(rowEl(c, idx++)); });
      app.appendChild(board);
    });
  } else {
    const board = el("div", "board");
    chans.forEach(function (c) { board.appendChild(rowEl(c, idx++)); });
    app.appendChild(board);
  }

  if (CONFIG.footer) app.appendChild(el("div", "foot", escapeHtml(CONFIG.footer)));
}

applyTelegram();
render();
updateCounts();
